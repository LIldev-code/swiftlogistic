<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="300" height="80" viewBox="0 0 300 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean white background -->
  <rect width="300" height="80" rx="0" fill="white"/>
  
  <!-- Professional icon: abstract logistics symbol -->
  <g transform="translate(15, 15)">
    <!-- Base shape -->
    <rect x="0" y="10" width="40" height="30" rx="1" fill="white" stroke="#1f2937" stroke-width="1.5"/>
    
    <!-- Red accent line -->
    <rect x="0" y="10" width="40" height="5" fill="#dc2626"/>
    
    <!-- Stylized airplane -->
    <path d="M20 0L30 10H10L20 0Z" fill="#dc2626"/>
    <path d="M15 20H25L20 30L15 20Z" fill="#dc2626"/>
    
    <!-- Connection lines -->
    <line x1="20" y1="10" x2="20" y2="20" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="10" y1="25" x2="15" y2="20" stroke="#1f2937" stroke-width="1"/>
    <line x1="30" y1="25" x2="25" y2="20" stroke="#1f2937" stroke-width="1"/>
  </g>
  
  <!-- Company name with professional typography -->
  <g>
    <text x="70" y="35" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#1f2937">CARGO</text>
    <text x="145" y="35" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#dc2626">LOGIC</text>
    <text x="70" y="55" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#1f2937">FLIGHT</text>
  </g>
  
  <!-- Subtle divider -->
  <line x1="70" y1="40" x2="200" y2="40" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Professional tagline -->
  <text x="70" y="65" font-family="Arial, sans-serif" font-weight="500" font-size="8" letter-spacing="1" fill="#6b7280">INTERNATIONAL LOGISTICS SOLUTIONS</text>
  
  <!-- Professional design element -->
  <g transform="translate(225, 20)">
    <rect x="0" y="0" width="60" height="40" rx="0" fill="white" stroke="#e5e7eb" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="60" y2="40" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="0" y1="40" x2="60" y2="0" stroke="#dc2626" stroke-width="1.5"/>
  </g>
</svg>
