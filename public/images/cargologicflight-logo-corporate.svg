<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="300" height="80" viewBox="0 0 300 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean white background -->
  <rect width="300" height="80" rx="2" fill="white"/>
  
  <!-- Professional emblem -->
  <g transform="translate(15, 20)">
    <!-- Stylized globe element -->
    <circle cx="20" cy="20" r="18" fill="white" stroke="#1f2937" stroke-width="1.5"/>
    <ellipse cx="20" cy="20" rx="18" ry="10" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="1 1" transform="rotate(-25 20 20)"/>
    
    <!-- Stylized airplane -->
    <path d="M30 15C30 15 26 12 23 10L12 12L8 15L12 17L8 19L5 17L3 20L8 22L12 25L23 27C26 25 30 22 30 22C31 21 32 18 30 15Z" fill="#dc2626"/>
    <path d="M12 17L23 12M12 17L23 22" stroke="white" stroke-width="0.75" stroke-linecap="round"/>
  </g>
  
  <!-- Company name with professional typography -->
  <g>
    <!-- CARGO -->
    <text x="60" y="32" font-family="Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="0.5" fill="#1f2937">CARGO</text>
    <!-- LOGIC in brand red -->
    <text x="130" y="32" font-family="Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="0.5" fill="#dc2626">LOGIC</text>
    <!-- FLIGHT -->
    <text x="60" y="52" font-family="Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="0.5" fill="#1f2937">FLIGHT</text>
  </g>
  
  <!-- Professional separator -->
  <line x1="60" y1="38" x2="190" y2="38" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Professional tagline -->
  <text x="60" y="65" font-family="Arial, sans-serif" font-weight="400" font-size="9" fill="#6b7280">GLOBAL LOGISTICS & TRANSPORTATION</text>
  
  <!-- Corporate design element -->
  <rect x="220" y="15" width="50" height="50" rx="2" fill="white" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="230" y="25" width="30" height="30" rx="1" fill="white" stroke="#1f2937" stroke-width="1"/>
  <line x1="230" y1="40" x2="260" y2="40" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="245" y1="25" x2="245" y2="55" stroke="#dc2626" stroke-width="1.5"/>
</svg>
