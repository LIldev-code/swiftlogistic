<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="500" height="200" viewBox="0 0 500 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle gradient -->
  <rect width="500" height="200" rx="12" fill="url(#paint0_linear)"/>
  
  <!-- Cargo box icon -->
  <g transform="translate(50, 60)">
    <!-- Main cargo box -->
    <rect x="0" y="20" width="80" height="60" rx="4" fill="url(#paint1_linear)" stroke="#1f2937" stroke-width="2"/>
    
    <!-- Box details -->
    <rect x="10" y="30" width="60" height="5" rx="1" fill="#1f2937" opacity="0.3"/>
    <rect x="10" y="45" width="60" height="5" rx="1" fill="#1f2937" opacity="0.3"/>
    <rect x="10" y="60" width="60" height="5" rx="1" fill="#1f2937" opacity="0.3"/>
    
    <!-- Airplane taking off from box -->
    <g transform="translate(40, 10) rotate(-15)">
      <path d="M40 15C40 15 34.6667 10.3333 30 8L15 10L10 15L15 17.5L10 20L5 17.5L2.5 22.5L10 25L15 30L30 32.5C34.6667 30.1667 40 25 40 25C41.6667 23.3333 43 20 40 15Z" fill="url(#paint2_linear)" stroke="#dc2626" stroke-width="1.5"/>
      <path d="M15 17.5L30 8M15 17.5L30 25M15 17.5L10 15M15 17.5L10 20" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- Flight path -->
    <path d="M80 20C120 0 160 -10 200 10" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 2" stroke-linecap="round"/>
    
    <!-- Speed lines -->
    <path d="M90 15L100 12" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M110 10L120 8" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M130 8L140 7" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Company name with modern typography -->
  <g transform="translate(160, 80)">
    <text font-family="Arial, sans-serif" font-weight="800" font-size="42" letter-spacing="1">
      <tspan x="0" y="0" fill="#1f2937">CARGO</tspan>
      <tspan x="140" y="0" fill="#dc2626">LOGIC</tspan>
    </text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-weight="800" font-size="42" letter-spacing="2" fill="#1f2937">FLIGHT</text>
    
    <!-- Tagline -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-weight="400" font-size="16" fill="#4b5563">Global Logistics Solutions</text>
  </g>
  
  <!-- Decorative elements -->
  <path d="M160 100h280" stroke="#dc2626" stroke-width="2" opacity="0.5"/>
  
  <!-- Globe element -->
  <g transform="translate(420, 70)">
    <circle cx="0" cy="0" r="20" fill="url(#paint3_radial)" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="20" ry="10" stroke="#dc2626" stroke-width="1" stroke-dasharray="2 2" transform="rotate(-15 0 0)"/>
    <ellipse cx="0" cy="0" rx="20" ry="10" stroke="#dc2626" stroke-width="1" stroke-dasharray="2 2" transform="rotate(75 0 0)"/>
  </g>
  
  <!-- Definitions for gradients and patterns -->
  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="500" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f4f6"/>
    </linearGradient>
    
    <linearGradient id="paint1_linear" x1="0" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3f4f6"/>
      <stop offset="1" stop-color="#d1d5db"/>
    </linearGradient>
    
    <linearGradient id="paint2_linear" x1="2.5" y1="8" x2="43" y2="32.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ef4444"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    
    <radialGradient id="paint3_radial" cx="0" cy="0" r="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dc2626" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
