<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="300" height="80" viewBox="0 0 300 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean white background -->
  <rect width="300" height="80" rx="4" fill="white"/>
  
  <!-- Professional airplane icon -->
  <g transform="translate(15, 20)">
    <path d="M36 16C36 12 32 10 28 8L16 10L10 16L16 18L10 20L6 18L4 22L10 24L16 28L28 30C32 28 36 24 36 24C38 22 38 20 36 16Z" fill="#dc2626"/>
    <path d="M16 18L28 10M16 18L28 24M16 18L10 16M16 18L10 20" stroke="white" stroke-width="1" stroke-linecap="round"/>
  </g>
  
  <!-- Company name with professional typography -->
  <g>
    <!-- CARGO -->
    <text x="60" y="35" font-family="Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="1" fill="#1f2937">CARGO</text>
    <!-- LOGIC in brand red -->
    <text x="135" y="35" font-family="Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="1" fill="#dc2626">LOGIC</text>
    <!-- FLIGHT -->
    <text x="60" y="55" font-family="Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="1" fill="#1f2937">FLIGHT</text>
  </g>
  
  <!-- Subtle divider line -->
  <line x1="60" y1="40" x2="200" y2="40" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Professional tagline -->
  <text x="60" y="70" font-family="Arial, sans-serif" font-weight="400" font-size="10" fill="#6b7280">GLOBAL LOGISTICS SOLUTIONS</text>
  
  <!-- Subtle decorative element -->
  <path d="M240 25C250 25 250 40 240 40" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <path d="M240 40C250 40 250 55 240 55" stroke="#dc2626" stroke-width="1.5" fill="none"/>
</svg>
